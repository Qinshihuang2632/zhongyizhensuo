<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{ title or clinic_name }}</title>
<style>
  @page { size: A4; margin: 14mm 12mm; }
  * { box-sizing: border-box; }
  body { font-family: "SimSun", "Microsoft YaHei", serif; color: #000; font-size: 12pt; margin: 0; }
  .doc-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 14px; }
  .doc-header .clinic { font-size: 18pt; font-weight: bold; letter-spacing: 2px; }
  .doc-header .sub { font-size: 10pt; margin-top: 4px; color: #333; }
  .doc-title { text-align: center; font-size: 15pt; font-weight: bold; margin: 6px 0 14px; letter-spacing: 4px; }
  table.grid { width: 100%; border-collapse: collapse; }
  table.grid th, table.grid td { border: 1px solid #000; padding: 5px 8px; font-size: 11pt; text-align: left; }
  table.grid th { background: #f0f0f0; text-align: center; }
  .doc-footer { margin-top: 18px; display: flex; justify-content: space-between; font-size: 10pt; color: #333; }
  @media screen {
    body { background: #e8e8e8; }
    .page { background: #fff; width: 210mm; min-height: 293mm; margin: 10px auto; padding: 14mm 12mm; box-shadow: 0 0 8px rgba(0,0,0,.35); }
  }
  @media print {
    .page { width: auto; min-height: auto; margin: 0; padding: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="doc-header">
    <div class="clinic">{{ clinic_name }}</div>
    {% if clinic_address or clinic_phone %}
    <div class="sub">{{ clinic_address }}{% if clinic_address and clinic_phone %}　{% endif %}{{ clinic_phone }}</div>
    {% endif %}
  </div>
  {% block body %}{% endblock %}
  <div class="doc-footer">
    <span>打印时间：{{ printed_at }}</span>
    <span>{{ footer_right or "" }}</span>
  </div>
</div>
</body>
</html>
